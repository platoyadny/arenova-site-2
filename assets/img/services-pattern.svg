<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <pattern id="doodlePattern" width="320" height="320" patternUnits="userSpaceOnUse">
      <rect width="320" height="320" fill="#ffffff"/>
      <g stroke="#9c9da1" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- paint roller -->
        <g transform="translate(22 16) rotate(-10)">
          <rect x="0" y="0" width="95" height="42" rx="12"/>
          <path d="M95 21h32c14 0 24 10 24 24v22"/>
          <path d="M151 67h-26"/>
          <rect x="107" y="67" width="56" height="70" rx="16"/>
        </g>
        <!-- brush -->
        <g transform="translate(158 26) rotate(12)">
          <path d="M0 0l56 16-20 72L-20 56z" fill="#ffffff"/>
          <path d="M12 46l24 8"/>
        </g>
        <!-- screwdriver -->
        <g transform="translate(236 24) rotate(30)">
          <path d="M0 0h32l8 16-8 16H0z" fill="#ffffff"/>
          <path d="M32 8h36"/>
        </g>
        <!-- tape roll -->
        <g transform="translate(30 120) scale(0.9)">
          <circle cx="0" cy="0" r="32"/>
          <circle cx="0" cy="0" r="12"/>
          <path d="M32 -2c10 0 18 8 18 18 0 10-8 18-18 18-6 0-10-2-14-6"/>
        </g>
        <!-- ladder -->
        <g transform="translate(105 110) rotate(-6)">
          <path d="M0 4l-16 112"/>
          <path d="M72 4l-16 112"/>
          <path d="M-4 34h68"/>
          <path d="M-10 64h68"/>
          <path d="M-16 94h68"/>
        </g>
        <!-- toolbox -->
        <g transform="translate(188 108)">
          <rect x="0" y="26" width="88" height="52" rx="8"/>
          <rect x="12" y="0" width="64" height="32" rx="6"/>
          <path d="M12 46h64"/>
          <path d="M28 62h32"/>
        </g>
        <!-- screwdriver scatter -->
        <g transform="translate(252 120) rotate(-38)">
          <path d="M0 0h24l6 12-6 12H0z" fill="#ffffff"/>
          <path d="M24 6h28"/>
        </g>
        <!-- wrench -->
        <g transform="translate(32 206) rotate(40)">
          <path d="M0 0c20-20 40-22 60-2l-18 18 18 18c-18 18-42 18-60-2z" fill="#ffffff"/>
          <path d="M32 16l80 80"/>
          <circle cx="108" cy="108" r="10"/>
        </g>
        <!-- saw -->
        <g transform="translate(132 206) rotate(-26)">
          <path d="M0 0h112l-12 48H12z" fill="#ffffff"/>
          <path d="M12 48l16 20 16-20 16 20 16-20 16 20 16-20"/>
        </g>
        <!-- bucket -->
        <g transform="translate(228 206) rotate(10)">
          <path d="M0 24l12 72c2 10 12 18 22 18h32c10 0 20-8 22-18l12-72z"/>
          <path d="M4 24c0-18 22-32 50-32s50 14 50 32"/>
        </g>
        <!-- drill -->
        <g transform="translate(22 274) rotate(-18)">
          <rect x="0" y="12" width="100" height="40" rx="12"/>
          <path d="M100 28h34l10 10-10 10H100"/>
          <path d="M26 0v24"/>
          <path d="M54 0v24"/>
          <path d="M18 52v24"/>
        </g>
        <!-- gloves -->
        <g transform="translate(130 270) rotate(18)">
          <path d="M0 0c10-6 20-6 30 0 0-16 20-24 30-12 0-14 18-18 28-6 0-12 16-16 24-6 12 14 0 74-20 90-24 18-58 12-74-18z" fill="#ffffff"/>
        </g>
        <!-- trowel -->
        <g transform="translate(236 274) rotate(42)">
          <path d="M0 0l52 20-20 52-52-20z" fill="#ffffff"/>
          <path d="M44 18l46 46"/>
        </g>
      </g>

      <g stroke="#9c9da1" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(160 160)">
        <!-- pliers -->
        <g transform="rotate(-24)">
          <path d="M0 0l20 32-42 64"/>
          <path d="M0 0l-20 32 42 64"/>
          <circle cx="0" cy="0" r="10"/>
        </g>
        <!-- rope coil -->
        <g transform="translate(-100 -110)">
          <ellipse cx="0" cy="0" rx="34" ry="22"/>
          <ellipse cx="0" cy="0" rx="22" ry="12"/>
          <path d="M-34 0c0 22 68 22 68 0"/>
        </g>
        <!-- nails -->
        <g transform="translate(-60 90) rotate(12)">
          <path d="M0 0h46"/>
          <path d="M10 12h46"/>
          <path d="M20 24h46"/>
        </g>
        <!-- light bulb -->
        <g transform="translate(88 90) rotate(-18)">
          <ellipse cx="0" cy="0" rx="30" ry="42"/>
          <path d="M-18 36h36"/>
          <path d="M-20 46h40"/>
          <path d="M-14 56h28"/>
          <path d="M0 -42V-62"/>
        </g>
        <!-- level -->
        <g transform="translate(-98 32) rotate(6)">
          <rect x="0" y="0" width="118" height="22" rx="10"/>
          <path d="M36 11a9 9 0 1 1 18 0 9 9 0 0 1-18 0z"/>
          <path d="M72 11a9 9 0 1 1 18 0 9 9 0 0 1-18 0z"/>
        </g>
        <!-- wrench tiny -->
        <g transform="translate(84 -44) rotate(32)">
          <path d="M0 0c12-12 24-12 34 0l-10 10 10 10c-10 10-24 10-34 0z" fill="#ffffff"/>
          <path d="M16 10l46 46"/>
        </g>
      </g>
    </pattern>
  </defs>
  <rect width="640" height="640" fill="url(#doodlePattern)"/>
</svg>
